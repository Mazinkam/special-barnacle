[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-agent-orchestrator"
version = "0.3.0"
description = "Model-agnostic hierarchical development orchestrator reference runtime"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
# Only files that live inside the `orchestrator` package can be shipped in the
# wheel. The `bridge/` TypeScript sources and `install.sh` live outside the
# package (repo-root siblings) and are installed from a git checkout via
# install.sh, not from the wheel -- do not list them here.
orchestrator = ["*.json", "presentation/*.html"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"orchestrator/archive/__init__.py" = ["F401"]
"orchestrator/ingest/__init__.py" = ["F401"]
"orchestrator/ingest_checkpoint.py" = ["F401"]
"orchestrator/runtime.py" = ["F401"]
# Ground rule 2 (docs/architecture-review.md, B3): every name importable from the old
# single-file orchestrator/cli.py must stay importable/patchable from this package's
# __init__.py, enforced by tests/test_cli_reexports.py.
"orchestrator/cli/__init__.py" = ["F401"]
# Backward-compatible re-export shim (see module docstring): every name that used to be
# importable from orchestrator/dashboard.py before the B3 presentation split stays
# importable here, including private helpers tests reach via dashboard._name.
"orchestrator/dashboard.py" = ["F401"]
# EFFORTS/CAPABILITY_TIER_TARGET are resolved lazily via module __getattr__ (B2 review
# finding: avoid a file read on bare import); __all__ lists them so `import *` still
# reaches them through __getattr__ (tests/test_star_exports.py).
"orchestrator/scheduler.py" = ["F822"]
"orchestrator/dynamic_adapter.py" = ["F822"]
