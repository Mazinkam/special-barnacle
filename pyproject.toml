[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-agent-orchestrator"
version = "0.3.0"
description = "Model-agnostic hierarchical development orchestrator reference runtime"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
# Only files that live inside the `orchestrator` package can be shipped in the
# wheel. The `bridge/` TypeScript sources and `install.sh` live outside the
# package (repo-root siblings) and are installed from a git checkout via
# install.sh, not from the wheel -- do not list them here.
orchestrator = ["*.json", "presentation/*.html"]
