name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python test runner
        run: python -m pip install --upgrade pip pytest pytest-xdist

      - name: Python tests (including module-layer checks)
        run: python3 -m pytest -q -n auto

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Bridge tests
        working-directory: bridge/extensions/orchestrator
        run: bun test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('scripts/lint.sh', 'knip.json') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Static analysis
        run: bash scripts/lint.sh

  # Aggregator: keeps the previously required check name `verify` gating merges.
  verify:
    needs: [python, bridge, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          [ "${{ needs.python.result }}" = success ] &&
          [ "${{ needs.bridge.result }}" = success ] &&
          [ "${{ needs.lint.result }}" = success ]
