name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Python test runner
        run: python -m pip install --upgrade pip pytest

      - name: Python tests (including module-layer checks)
        run: python3 -m pytest -q

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Bridge tests
        working-directory: bridge/extensions/orchestrator
        run: bun test

      - uses: astral-sh/setup-uv@v5

      - name: Static analysis
        run: bash scripts/lint.sh
